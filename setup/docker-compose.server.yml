# Server deployment behind nginx-proxy + Let's Encrypt
# (https://github.com/SHFSAS/documentacion-docker).
#
# Before starting, replace the example domains and email:
#   - odoo.example.com   -> domain for Odoo
#   - pgadmin.example.com -> domain for pgAdmin
#   - admin@example.com  -> email for Let's Encrypt notifications

services:
  ai_up_odoo:
    build:
      context: ../
      dockerfile: setup/Dockerfile
    container_name: ai_up_odoo
    restart: unless-stopped
    depends_on:
      - ai_up_odoo_db
    volumes:
      # ✅ datos persistentes
      - odoo_web:/var/lib/odoo
      - odoo_models:/var/lib/ai-models

      # ✅ config
      - ./config:/etc/odoo

      # ✅ addons
      - ../odoo/custom-addons:/mnt/custom-addons
      - ../odoo/third-party-addons:/mnt/third-party-addons

    environment:
      VIRTUAL_HOST: odoo.example.com
      VIRTUAL_PORT: 8069
      LETSENCRYPT_HOST: odoo.example.com
      LETSENCRYPT_EMAIL: admin@example.com
    env_file:
      - .env
    networks:
      - database
      - web
    shm_size: '1gb'
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          memory: 4g
    mem_limit: 8g
    memswap_limit: 8g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  ai_up_odoo_db:
    image: pgvector/pgvector:pg17
    container_name: ai_up_odoo_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # ✅ DB persistente
      - odoo_db:/var/lib/postgresql/data
    networks:
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  pgadmin:
    image: dpage/pgadmin4
    container_name: ai_up_odoo_pgadmin
    restart: unless-stopped
    depends_on:
      - ai_up_odoo_db
    volumes:
      # ✅ volumen sin permisos manuales
      - pgadmin_data:/var/lib/pgadmin
    environment:
      VIRTUAL_HOST: pgadmin.example.com
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: pgadmin.example.com
      LETSENCRYPT_EMAIL: admin@example.com
      PGADMIN_LISTEN_PORT: 80
    env_file:
      - .env
    networks:
      - database
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

volumes:
  odoo_web:
  odoo_models:
  odoo_db:
  pgadmin_data:

networks:
  database:
    driver: bridge
  web:
    external: true
